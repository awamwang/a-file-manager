name: 🐞 Bug report
description: Report something that isn't working as expected.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.
        Do **not** use this form for security issues — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: What happened vs. what you expected?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to make the problem occur.
      placeholder: |
        1. Open ...
        2. Right-click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: flavor
    attributes:
      label: Build flavor
      description: Which installer / feature set are you using?
      options:
        - Core
        - AI (with AI add-on)
        - Dev build
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version (see Settings → About, or the release tag).
      placeholder: e.g. v0.3.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS and version.
      placeholder: e.g. Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste any relevant console output, error text, or drag in screenshots.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission
      options:
        - label: I checked existing issues for duplicates.
          required: true
        - label: I am using the latest release (or can reproduce on it).
          required: false
