# SPDX-License-Identifier: GPL-3.0-or-later
# 构建期门禁：声明的 Node/Rust 工具链 + 前端构建 + 全量契约与 Rust 测试。
# 7.25: Windows + macOS 双平台矩阵；Windows 专属断言只在该 runner 上跑。
name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - os: macos-latest
            rust_target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Knowledge generality gate (check-knowledge-generality.mjs) reads
          # upstream/awam-knowledge source; without the submodules it fails with
          # ENOENT on a clean checkout. The awam-* submodules are public.
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # check-knowledge-generality.mjs spawns Python to run the submodule's
      # generality self-checks and asserts when no interpreter is found. Pin it
      # here so the gate never depends on the runner image's (sometimes Store-
      # stub) default; matches release.yml feed builds.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust (respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache (OS + target scoped)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ci-${{ matrix.os }}-${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Declare engines / toolchain surface
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(!p.engines?.node) process.exit(1); console.log('engines.node=', p.engines.node)"
          test -f rust-toolchain.toml
          test -f src-tauri/tauri.conf.json

      - name: Frontend typecheck + build
        run: npm run build

      - name: Full contract + Rust test chain
        run: npm test

      - name: Adapter compiles for ${{ matrix.rust_target }}
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.rust_target }}

      # WebView2 bootstrapper is meaningless on macOS; keep the assertion on
      # Windows only so the matrix never hides a real Windows regression.
      - name: Windows-only release surface
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.bundle?.windows?.webviewInstallMode?.type!=='embedBootstrapper') process.exit(1)"
          npm run test:packaging-flavors
