# SPDX-License-Identifier: GPL-3.0-or-later
# Tag 驱动多包发版：同一 vX.Y.Z → 主线版(Mainline, ai) NSIS + 精简版(Lite, core) NSIS + Feature Pack zip 挂到一个 GitHub Release。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.3.0 或 v0.3.0）；留空则用 package.json"
        required: false
        type: string
      packs:
        description: "要构建的包：all 或 core,ai,feature-pack（ai=主线版 / core=精简版）"
        required: false
        default: "all"
        type: string
      publish:
        description: "全部产物上传后是否取消 draft（正式发布）"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      packs: ${{ steps.meta.outputs.packs }}
      want_core: ${{ steps.meta.outputs.want_core }}
      want_ai: ${{ steps.meta.outputs.want_ai }}
      want_feature_pack: ${{ steps.meta.outputs.want_feature_pack }}
      flavor_matrix: ${{ steps.meta.outputs.flavor_matrix }}
      mac_matrix: ${{ steps.meta.outputs.mac_matrix }}
      publish: ${{ steps.meta.outputs.publish }}
      mac_signing: ${{ steps.meta.outputs.mac_signing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve tag, version, packs
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PACKS: ${{ inputs.packs }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          # 7.26 opt-in signing: presence of the full Apple credential set
          # decides signed+notarized vs the default ad-hoc bundle. Never print
          # these values — only the derived boolean goes to GITHUB_OUTPUT.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_VERSION:-}" ]; then
            RAW="${INPUT_VERSION}"
            RAW="${RAW#v}"
            TAG="v${RAW}"
          else
            VER="$(node -p "require('./package.json').version")"
            TAG="v${VER}"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "非法版本号: ${VERSION}"
            exit 1
          fi
          PRE=false
          if [[ "$VERSION" == *-* ]]; then
            PRE=true
          fi

          PACKS_RAW="${INPUT_PACKS:-all}"
          if [ -z "${PACKS_RAW}" ]; then PACKS_RAW=all; fi
          export PACKS_RAW
          PACKS_CSV="$(node --input-type=module -e "
            import { parsePackKinds } from './scripts/release-assets.mjs';
            process.stdout.write(parsePackKinds(process.env.PACKS_RAW || 'all').join(','));
          ")"

          WANT_CORE=false
          WANT_AI=false
          WANT_FP=false
          IFS=',' read -ra KIND_ARR <<< "${PACKS_CSV}"
          for k in "${KIND_ARR[@]}"; do
            case "$k" in
              core) WANT_CORE=true ;;
              ai) WANT_AI=true ;;
              feature-pack) WANT_FP=true ;;
            esac
          done
          export PACKS_CSV
          FLAVOR_JSON="$(node --input-type=module -e "
            const kinds = (process.env.PACKS_CSV || '').split(',').filter(Boolean);
            const rows = [];
            if (kinds.includes('core')) rows.push({ flavor: 'core', vite_ai: '0' });
            if (kinds.includes('ai')) rows.push({ flavor: 'ai', vite_ai: '1' });
            process.stdout.write(JSON.stringify(rows));
          ")"
          # 7.25: macOS 每个 flavor 出两个原生架构，沿用同一份 packs 选择。
          MAC_JSON="$(node --input-type=module -e "
            import { macReleaseMatrix } from './scripts/release-assets.mjs';
            const kinds = (process.env.PACKS_CSV || '').split(',').filter(Boolean);
            process.stdout.write(JSON.stringify(macReleaseMatrix(kinds)));
          ")"

          PUBLISH=true
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_PUBLISH}" = "false" ]; then
            PUBLISH=false
          fi

          # 7.26: sign + notarize only when all five Apple secrets are set.
          # A partial set is treated as unconfigured so CI never fails on
          # half-provided credentials — it just keeps the ad-hoc fallback.
          MAC_SIGNING=false
          if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_CERTIFICATE_PASSWORD:-}" ] && \
             [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            MAC_SIGNING=true
          fi
          if [ "${MAC_SIGNING}" = "true" ]; then
            echo "Apple signing credentials complete — macOS builds will be signed + notarized"
          else
            echo "Apple signing credentials incomplete or absent — macOS builds use ad-hoc fallback"
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prerelease=${PRE}"
            echo "packs=${PACKS_CSV}"
            echo "want_core=${WANT_CORE}"
            echo "want_ai=${WANT_AI}"
            echo "want_feature_pack=${WANT_FP}"
            echo "flavor_matrix=${FLAVOR_JSON}"
            echo "mac_matrix=${MAC_JSON}"
            echo "publish=${PUBLISH}"
            echo "mac_signing=${MAC_SIGNING}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} version=${VERSION} packs=${PACKS_CSV} matrix=${FLAVOR_JSON} mac=${MAC_JSON} publish=${PUBLISH} mac_signing=${MAC_SIGNING}"

      - name: Sync version into package / tauri / cargo
        shell: bash
        run: node scripts/sync-version.mjs "${{ steps.meta.outputs.version }}"

      - name: Generate release notes and ensure draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRE: ${{ steps.meta.outputs.prerelease }}
          MAC_SIGNING: ${{ steps.meta.outputs.mac_signing }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/afm-notes.md"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          else
            PREV="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          fi

          BODY=""
          GEN_ARGS=(-f tag_name="${TAG}" -f target_commitish="${GITHUB_SHA}")
          if [ -n "${PREV}" ]; then
            GEN_ARGS+=(-f previous_tag_name="${PREV}")
          fi
          if BODY=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              "${GEN_ARGS[@]}" --jq .body 2>/dev/null); then
            :
          else
            if [ -n "${PREV}" ]; then
              RANGE="${PREV}..${GITHUB_SHA}"
              HEADING="## Changes since ${PREV}"
            else
              RANGE="${GITHUB_SHA}"
              HEADING="## Changes"
            fi
            {
              echo "${HEADING}"
              echo
              git log --pretty=format:'- %s (%h)' "${RANGE}"
              echo
            } > "${NOTES_FILE}.fallback"
            BODY="$(cat "${NOTES_FILE}.fallback")"
          fi

          {
            printf '%s\n\n' "${BODY}"
            echo "### Packages"
            echo
            echo "同一版本号下提供多个安装包（不是三个不同 semver）："
            echo
            echo "| Asset | 说明 |"
            echo "|---|---|"
            echo "| \`A.File.Manager_${VERSION}_x64-setup.exe\` | **主线版 Mainline**（默认含 ai-addon，= 普通正式版，推荐） |"
            echo "| \`A.File.Manager_${VERSION}_x64-lite-setup.exe\` | **精简版 Lite**（无 AI Add-on） |"
            echo "| \`A.File.Manager_${VERSION}_{aarch64|x64}[-lite].dmg\` | **macOS**（Apple Silicon / Intel；主线版无后缀 / 精简版带 \`-lite\`） |"
            echo "| \`A.File.Manager_${VERSION}_{aarch64|x64}[-lite].app.zip\` | **macOS 应用包**（与对应 DMG 同源） |"
            echo "| \`A.File.Manager_${VERSION}_macos-install.sh\` | **macOS 一键安装脚本**（无 Developer ID 版本，清除下载隔离） |"
            echo "| \`A.File.Manager_${VERSION}_feature-pack-*.zip\` | **Feature Pack**（与版本无关，本机 zip 安装） |"
            echo
            echo
            if [ "${MAC_SIGNING}" = "true" ]; then
              echo "macOS 包已用 Developer ID 签名并经 Apple 公证（notarized + stapled），可直接双击打开。"
            else
              echo "macOS 包为 ad-hoc 签名（未配置 Developer ID / 公证）。macOS 15+ 已移除 Finder 右键 →「打开」的单次放行入口。推荐 Homebrew 一行安装（自建 tap，装完自动清隔离）："
              echo '`brew install --cask awamwang/tap/a-file-manager`，之后 `brew upgrade --cask a-file-manager` 即可升级。'
              echo '或下载本 Release 用安装脚本：从 DMG 根目录在终端执行 `bash 安装-A-File-Manager.sh`；独立资产 `A.File.Manager_'"${VERSION}"'_macos-install.sh` 需先与 `.app.zip` 解压出的 App 放同一目录再执行。脚本会把 App 装到 /Applications、清除下载隔离属性并直接启动。'
              echo '安装后双击即可打开，不需要系统设置或右键放行。若不想用脚本，手工方式见包内《打开帮助.txt》：'
              echo '1) 双击 App 一次 → 系统设置 → 隐私与安全性 → 安全性 → 仍要打开 → 打开；'
              echo '2) 或终端执行 `xattr -dr com.apple.quarantine "/Applications/A File Manager.app"`。'
              echo "独立帮助文件也作为 Release 资产 A.File.Manager_${VERSION}_macos-open-help.txt 提供。"
            fi
            echo "### Install"
            echo
            echo "Download a Windows NSIS \`.exe\`, a macOS \`.dmg\` / \`.app.zip\`, or Feature Pack \`.zip\` below."
            echo "macOS via Homebrew: \`brew install --cask awamwang/tap/a-file-manager\` (self-hosted tap)."
            echo
            echo "All builds: https://github.com/${{ github.repository }}/releases"
          } > "${NOTES_FILE}"

          PRE_ARGS=()
          if [ "${PRE}" = "true" ]; then PRE_ARGS+=(--prerelease); fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refresh notes and keep draft until finalize"
            gh release edit "${TAG}" --notes-file "${NOTES_FILE}" --draft=true || true
          else
            if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
              gh release create "${TAG}" --draft --title "A File Manager ${TAG}" \
                --notes-file "${NOTES_FILE}" "${PRE_ARGS[@]}"
            else
              gh release create "${TAG}" --draft --title "A File Manager ${TAG}" \
                --notes-file "${NOTES_FILE}" --target "${GITHUB_SHA}" "${PRE_ARGS[@]}"
            fi
          fi

      - name: Upload macOS open help as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/A.File.Manager_${VERSION}_macos-open-help.txt"
          cp src-tauri/resources/macos-open-help.txt "${DEST}"
          gh release upload "${TAG}" "${DEST}" --clobber
          echo "Uploaded $(basename "${DEST}")"

      - name: Upload macOS installer as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="${RUNNER_TEMP}/A.File.Manager_${VERSION}_macos-install.sh"
          cp scripts/install-macos.sh "${DEST}"
          gh release upload "${TAG}" "${DEST}" --clobber
          echo "Uploaded $(basename "${DEST}")"

  build-app:
    needs: prepare
    if: needs.prepare.outputs.flavor_matrix != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.flavor_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync version
        shell: bash
        run: node scripts/sync-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust (respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: release-${{ matrix.flavor }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify WebView2 auto-install bundling
        shell: bash
        run: |
          set -euo pipefail
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.bundle?.windows?.webviewInstallMode?.type!=='embedBootstrapper') process.exit(1)"
          npm run test:deps-surface

      - name: Build NSIS (${{ matrix.flavor }})
        env:
          VITE_AFM_AI_ADDON: ${{ matrix.vite_ai }}
        shell: bash
        run: node scripts/build-flavor.mjs "${{ matrix.flavor }}" --bundle

      - name: Collect canonical asset
        id: asset
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FLAVOR: ${{ matrix.flavor }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          SRC="src-tauri/target/release/bundle/nsis/A File Manager_${VERSION}_x64-setup.exe"
          if [ ! -f "${SRC}" ]; then
            echo "Missing NSIS artifact: ${SRC}"
            ls -la "src-tauri/target/release/bundle/nsis" || true
            exit 1
          fi
          DEST="$(node --input-type=module -e "
            import { nsisAssetName } from './scripts/release-assets.mjs';
            process.stdout.write(nsisAssetName(process.env.VERSION, process.env.FLAVOR));
          ")"
          cp "${SRC}" "dist/release/${DEST}"
          echo "file=${DEST}" >> "$GITHUB_OUTPUT"
          echo "Collected ${DEST}"

      - name: Sign Windows installer (optional)
        # Sign AFTER collecting the canonical asset and BEFORE upload: the
        # uploaded bytes are the signed ones. No secret configured -> no-op,
        # so unsigned builds keep working (SmartScreen reputation still needs
        # a real OV/EV cert; see msix/README.md).
        env:
          ASSET: ${{ steps.asset.outputs.file }}
          AFM_SIGN_CERT_B64: ${{ secrets.AFM_SIGN_CERT_B64 }}
          AFM_SIGN_CERT_PASSWORD: ${{ secrets.AFM_SIGN_CERT_PASSWORD }}
          AFM_SIGN_THUMBPRINT: ${{ secrets.AFM_SIGN_THUMBPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${AFM_SIGN_CERT_B64}" ] && [ -z "${AFM_SIGN_THUMBPRINT}" ]; then
            echo "No Windows code-signing secret configured; skipping sign."
            exit 0
          fi
          TARGET="dist/release/${ASSET}"
          if [ -n "${AFM_SIGN_CERT_B64}" ]; then
            printf '%s' "${AFM_SIGN_CERT_B64}" | base64 -d > "${RUNNER_TEMP}/afm-sign.pfx"
            # password is read from AFM_SIGN_CERT_PASSWORD by sign_file.ps1;
            # passing it on the argv would leak it into the process list.
            pwsh -NoProfile -File scripts/sign_file.ps1 \
              -FilePath "${TARGET}" \
              -CertificatePath "${RUNNER_TEMP}/afm-sign.pfx"
          else
            # UKey / cloud-signing client imported cert: SHA1 thumbprint.
            pwsh -NoProfile -File scripts/sign_file.ps1 \
              -FilePath "${TARGET}" \
              -Thumbprint "${AFM_SIGN_THUMBPRINT}"
          fi

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            "dist/release/${{ steps.asset.outputs.file }}" --clobber

  # 7.25: macOS packages on real macOS runners. Windows jobs keep their exact
  # NSIS behavior. 7.26: when the five APPLE_* secrets are configured, the build
  # is code-signed + notarized (Gatekeeper-clean); otherwise it stays ad-hoc.
  build-app-macos:
    needs: prepare
    if: needs.prepare.outputs.mac_matrix != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.mac_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 7.26: opt-in Developer ID signing. Only runs when prepare detected the
      # full credential set; a temporary keychain keeps the runner's login
      # keychain untouched. Tauri infers the signing identity from the imported
      # APPLE_CERTIFICATE, so no explicit signingIdentity in tauri.conf.json.
      - name: Import Apple Developer Certificate (signed builds only)
        if: needs.prepare.outputs.mac_signing == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'afm-ci-keychain' }}
        shell: bash
        run: |
          set -euo pipefail
          CERT="${RUNNER_TEMP}/afm-codesign.p12"
          KEYCHAIN="${RUNNER_TEMP}/afm-build.keychain-db"
          printf '%s' "${APPLE_CERTIFICATE}" | base64 --decode > "${CERT}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -t 3600 -u "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${CERT}" -k "${KEYCHAIN}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "${KEYCHAIN}"
          rm -f "${CERT}"
          security find-identity -v -p codesigning "${KEYCHAIN}"
          echo "Developer ID certificate imported into temporary keychain"

      - name: Sync version
        shell: bash
        run: node scripts/sync-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust (target ${{ matrix.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache (flavor + arch scoped)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: release-macos-${{ matrix.flavor }}-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify macOS bundle contract
        shell: bash
        run: |
          set -euo pipefail
          node -e "const c=require('./src-tauri/tauri.conf.json'); for (const t of ['app','dmg']) if (!c.bundle.targets.includes(t)) process.exit(1)"
          npm run test:macos-bundle

      - name: Build macOS bundles (${{ matrix.flavor }} / ${{ matrix.arch }})
        env:
          VITE_AFM_AI_ADDON: ${{ matrix.vite_ai }}
          MAC_SIGNING: ${{ needs.prepare.outputs.mac_signing }}
          # 7.26: with a Developer ID certificate in the keychain plus these
          # credentials, `tauri build` signs, notarizes and staples the .app/.dmg
          # automatically. Tauri treats a *set but empty* APPLE_CERTIFICATE as
          # configured, so ad-hoc builds must unset them before invoking build.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${MAC_SIGNING}" != "true" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            echo "No Apple credentials — Tauri builds unsigned; ad-hoc finalize follows"
          else
            echo "Apple credentials present — Tauri will sign + notarize + staple"
          fi
          node scripts/build-flavor.mjs "${{ matrix.flavor }}" --bundle --target "${{ matrix.target }}"

      # 7.27: without Developer ID, Tauri leaves the .app completely unsigned.
      # Explicit ad-hoc signing plus a DMG that carries 打开帮助.txt makes the
      # zero-credential path usable; signed/notarized builds skip this step.
      - name: Finalize unsigned macOS bundle (ad-hoc + in-package help)
        if: needs.prepare.outputs.mac_signing != 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${TARGET}/release/bundle"
          APP="${BUNDLE}/macos/A File Manager.app"
          DMG="${BUNDLE}/dmg/A File Manager_${VERSION}_${ARCH}.dmg"
          node scripts/finalize-macos-adhoc.mjs \
            --app "${APP}" \
            --dmg "${DMG}" \
            --help-file src-tauri/resources/macos-open-help.txt \
            --installer scripts/install-macos.sh

      - name: Collect canonical assets
        id: asset
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          FLAVOR: ${{ matrix.flavor }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          BUNDLE="src-tauri/target/${TARGET}/release/bundle"
          DMG_SRC="${BUNDLE}/dmg/A File Manager_${VERSION}_${ARCH}.dmg"
          APP_SRC="${BUNDLE}/macos/A File Manager.app"
          if [ ! -f "${DMG_SRC}" ]; then
            echo "Missing DMG: ${DMG_SRC}"
            ls -la "${BUNDLE}/dmg" || true
            exit 1
          fi
          if [ ! -d "${APP_SRC}" ]; then
            echo "Missing app bundle: ${APP_SRC}"
            ls -la "${BUNDLE}/macos" || true
            exit 1
          fi
          DMG_DEST="$(node --input-type=module -e "
            import { dmgAssetName } from './scripts/release-assets.mjs';
            process.stdout.write(dmgAssetName(process.env.VERSION, process.env.FLAVOR, process.env.ARCH));
          ")"
          ZIP_DEST="$(node --input-type=module -e "
            import { appZipAssetName } from './scripts/release-assets.mjs';
            process.stdout.write(appZipAssetName(process.env.VERSION, process.env.FLAVOR, process.env.ARCH));
          ")"
          cp "${DMG_SRC}" "dist/release/${DMG_DEST}"
          ditto -c -k --keepParent "${APP_SRC}" "dist/release/${ZIP_DEST}"
          echo "dmg=${DMG_DEST}" >> "$GITHUB_OUTPUT"
          echo "app_zip=${ZIP_DEST}" >> "$GITHUB_OUTPUT"
          echo "Collected ${DMG_DEST} and ${ZIP_DEST}"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            "dist/release/${{ steps.asset.outputs.dmg }}" \
            "dist/release/${{ steps.asset.outputs.app_zip }}" --clobber

  # 自建 tap：官方 homebrew/cask 不再接受无 Developer ID / 公证的 cask。
  # 这里从 Release 资产 digest 生成 Cask，装完用 postflight_steps 清隔离。
  publish-homebrew-tap:
    needs: [prepare, build-app-macos]
    if: needs.prepare.outputs.want_ai == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Read release asset checksums
        id: digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.prepare.outputs.version }}"
          API="repos/${{ github.repository }}/releases/tags/${{ needs.prepare.outputs.tag }}"
          A="A.File.Manager_${V}_aarch64.app.zip"
          X="A.File.Manager_${V}_x64.app.zip"
          for name in "$A" "$X"; do
            digest="$(gh api "$API" --jq ".assets[] | select(.name == \"${name}\") | .digest // \"\"" | head -1)"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Missing sha256 digest for ${name}" >&2
              exit 1
            fi
            case "$name" in
              "$A") echo "aarch64=${digest#sha256:}" >> "$GITHUB_OUTPUT" ;;
              "$X") echo "x64=${digest#sha256:}" >> "$GITHUB_OUTPUT" ;;
            esac
          done

      - name: Render Cask
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sync-homebrew-tap.mjs \
            --version "${{ needs.prepare.outputs.version }}" \
            --sha-aarch64 "${{ steps.digest.outputs.aarch64 }}" \
            --sha-x64 "${{ steps.digest.outputs.x64 }}" \
            --out dist/release/a-file-manager.rb
          ruby -c dist/release/a-file-manager.rb

      - name: Publish to awamwang/homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: awamwang/homebrew-tap
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          API="repos/${TAP}/contents/Casks/a-file-manager.rb"
          CONTENT="$(base64 < dist/release/a-file-manager.rb | tr -d '\n')"
          SHA="$(gh api "${API}?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "$API" \
              -f message="chore(cask): update a-file-manager to ${VERSION}" \
              -f content="$CONTENT" \
              -f sha="$SHA"
          else
            gh api --method PUT "$API" \
              -f message="chore(cask): add a-file-manager ${VERSION}" \
              -f content="$CONTENT"
          fi
          echo "Tap Cask updated for ${VERSION}"

  build-feature-packs:
    needs: prepare
    if: needs.prepare.outputs.want_feature_pack == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Package Feature Packs
        shell: bash
        run: node scripts/package-feature-packs.mjs "${{ needs.prepare.outputs.version }}"

      - name: Upload Feature Pack zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/release/*_feature-pack-*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No feature-pack zip produced"
            exit 1
          fi
          gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" --clobber

  # P2-5 / ADR0022：AFM 作为集成方，从 upstream/ submodule 源码 in-tree 构建 managed 后端
  # 产物（PyInstaller onefile）。PyInstaller 不可跨平台冻结，故三个平台各在对应 runner 上
  # build 一个 feed slice（局部 manifest + 产物），交给 merge-pack-feed 合成唯一 manifest
  # 后统一上传 Release（主源）+ 可选 OSS 镜像（回落源）。
  # Mac x64 产物名加 -x64 后缀，避免与 Apple Silicon 的无扩展名同名产物在扁平 Release 里互相覆盖。
  # 说明：任一 job 失败时 finalize 会因「依赖未全部 success/skipped」而保留 draft，不会发布坏 release。
  build-pack-feed:
    needs: prepare
    if: needs.prepare.outputs.want_feature_pack == 'true'
    # 三平台 sidecar 均为发布阻塞项：Windows + Apple Silicon 在本 job 矩阵，Intel 见
    # build-pack-feed-intel。任一平台失败就让 merge 跳过、finalize 保留 draft，绝不发布
    # 一份缺 Mac 产物的 manifest（否则 Mac 用户装到的 pack 只有清单、起不了后端）。
    # 旧的 continue-on-error 源于上游 requirements.lock 把 pywin32 无 marker pin 死；
    # 现锁文件已带 `; sys_platform == 'win32'`，macOS 解析会正确跳过它（2026-11-24 实测）。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            name_suffix: ""
            python_rel: ".venv-feed/Scripts/python.exe"
          - os: macos-latest            # Apple Silicon (arm64)
            platform: macos-aarch64
            name_suffix: ""
            python_rel: ".venv-feed/bin/python"
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      # 主源：GitHub Release 扁平资产下载 URL 基址（feed manifest 的 assetUrl/installUrl 用 flat 布局指这里）。
      GH_FEED_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout (含 submodule 源码)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend build deps (from lockfiles)
        shell: bash
        run: |
          set -euo pipefail
          uv venv .venv-feed --python 3.12
          # venv 解释器路径按平台不同：Windows Scripts/python.exe，Unix bin/python。
          PY="$PWD/${{ matrix.python_rel }}"
          # tool-manager 用全 pin 的 requirements.lock；awam-file 用 pyproject/requirements + 冻结/分析工具。
          uv pip install --python "$PY" -r upstream/awam-tool-manager/requirements.lock
          uv pip install --python "$PY" -r upstream/awam-file/requirements.txt
          uv pip install --python "$PY" PyInstaller typer rich
          echo "PY_ABS=$PY" >> "$GITHUB_ENV"

      - name: Build managed backend artifacts + feed slice (${{ matrix.platform }})
        shell: bash
        run: |
          set -euo pipefail
          # 固定路径，便于 upload-artifact 用 runner.temp context 引用
          # （GITHUB_ENV 写入的变量不会进入 with: 里的 env context）。
          FEED="${RUNNER_TEMP}/afm-feed-${{ matrix.platform }}"
          mkdir -p "$FEED"
          VER_TOOL="$(node -p "require('./packs/tool-runtime/pack.json').version")"
          VER_FILE="$(node -p "require('./packs/file-gateway/pack.json').version")"
          SUFFIX="${{ matrix.name_suffix }}"
          PLATFORM="${{ matrix.platform }}"
          VER_KM="$(node -p "require('./packs/knowledge/pack.json').version")"
          # tool-runtime（扁平 server.py 入口）
          "$PY_ABS" scripts/build_pack_feed.py build \
            --pack-id awam.tool-runtime --name "awam-tool-manager${SUFFIX}" \
            --src upstream/awam-tool-manager --entry src/server.py \
            --version "$VER_TOOL" --out "$FEED" --url-layout flat \
            --base-feed-url "$GH_FEED_BASE" --base-probe-url http://127.0.0.1:18778 \
            --platform "$PLATFORM" --python "$PY_ABS"
          # file-gateway（包式入口，需 collect 包 + 内嵌 filesystems.html）
          "$PY_ABS" scripts/build_pack_feed.py build \
            --pack-id awam.file-gateway --name "awam-resource-gateway${SUFFIX}" \
            --src upstream/awam-file --entry src/awam_resource_gateway/__main__.py \
            --paths src --collect awam_resource_gateway \
            --add-data "src/awam_resource_gateway/filesystems.html;awam_resource_gateway" \
            --version "$VER_FILE" --out "$FEED" --url-layout flat \
            --base-feed-url "$GH_FEED_BASE" --base-probe-url http://127.0.0.1:18787 \
            --platform "$PLATFORM" --python "$PY_ABS"
          # knowledge（包式入口；stdlib http_service，零外部依赖；随包分发 config/*.json）
          # ADR 0024：knowledge 与 file/tool 同构（runtime:self onefile），非版本特例、不再内置安装器。
          "$PY_ABS" scripts/build_pack_feed.py build \
            --pack-id awam.knowledge --name "awam-knowledge${SUFFIX}" \
            --src upstream/awam-knowledge --entry src/awam_knowledge/__main__.py \
            --paths src --collect awam_knowledge \
            --version "$VER_KM" --out "$FEED" --url-layout flat \
            --base-feed-url "$GH_FEED_BASE" --base-probe-url http://127.0.0.1:18790 \
            --platform "$PLATFORM" --python "$PY_ABS"
          echo "=== slice manifest ($PLATFORM) ==="; cat "$FEED/manifest.json"

      # pack zip 平台无关，只构建一次（Windows slice），避免三份同 SHA 资产重复上传。
      - name: Package Feature Pack zips (platform-neutral, once)
        if: matrix.platform == 'windows-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          FEED="${RUNNER_TEMP}/afm-feed-${{ matrix.platform }}"
          VER_TOOL="$(node -p "require('./packs/tool-runtime/pack.json').version")"
          VER_FILE="$(node -p "require('./packs/file-gateway/pack.json').version")"
          VER_KM="$(node -p "require('./packs/knowledge/pack.json').version")"
          "$PY_ABS" scripts/build_pack_feed.py pack-dir \
            --pack-id awam.tool-runtime --name "工具管理运行时" --version "$VER_TOOL" \
            --src packs/tool-runtime --out "$FEED" --url-layout flat --base-feed-url "$GH_FEED_BASE"
          "$PY_ABS" scripts/build_pack_feed.py pack-dir \
            --pack-id awam.file-gateway --name "awam 资源网关" --version "$VER_FILE" \
            --src packs/file-gateway --out "$FEED" --url-layout flat --base-feed-url "$GH_FEED_BASE"
          "$PY_ABS" scripts/build_pack_feed.py pack-dir \
            --pack-id awam.knowledge --name "awam 知识库" --version "$VER_KM" \
            --src packs/knowledge --out "$FEED" --url-layout flat --base-feed-url "$GH_FEED_BASE"
          echo "=== slice manifest with packs ==="; cat "$FEED/manifest.json"

      - name: Upload feed slice as artifact
        uses: actions/upload-artifact@v4
        with:
          name: afm-feed-${{ matrix.platform }}
          path: ${{ runner.temp }}/afm-feed-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1

  # macOS Intel(x86_64) feed slice：macos-15-intel 自 2025-09 起是 GitHub 托管 runner 的
  # 公开标签（标准 runner 用户可用，非自建），因此默认构建，不再需要 dispatch 勾选。
  # 独立 job 只为让 Intel 特有的 name_suffix="-x64" 与 python 路径单独解析；steps 与
  # build-pack-feed 同构。pack zip 平台无关，仍只由主 job 打一次。
  build-pack-feed-intel:
    needs: prepare
    if: needs.prepare.outputs.want_feature_pack == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: macos-x86_64
            name_suffix: "-x64"
            python_rel: ".venv-feed/bin/python"
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_FEED_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout (含 submodule 源码)
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend build deps (from lockfiles)
        shell: bash
        run: |
          set -euo pipefail
          uv venv .venv-feed --python 3.12
          PY="$PWD/${{ matrix.python_rel }}"
          uv pip install --python "$PY" -r upstream/awam-tool-manager/requirements.lock
          uv pip install --python "$PY" -r upstream/awam-file/requirements.txt
          uv pip install --python "$PY" PyInstaller typer rich
          echo "PY_ABS=$PY" >> "$GITHUB_ENV"

      - name: Build managed backend artifacts + feed slice (${{ matrix.platform }})
        shell: bash
        run: |
          set -euo pipefail
          FEED="${RUNNER_TEMP}/afm-feed-${{ matrix.platform }}"
          mkdir -p "$FEED"
          VER_TOOL="$(node -p "require('./packs/tool-runtime/pack.json').version")"
          VER_FILE="$(node -p "require('./packs/file-gateway/pack.json').version")"
          SUFFIX="${{ matrix.name_suffix }}"
          PLATFORM="${{ matrix.platform }}"
          VER_KM="$(node -p "require('./packs/knowledge/pack.json').version")"
          "$PY_ABS" scripts/build_pack_feed.py build \
            --pack-id awam.tool-runtime --name "awam-tool-manager${SUFFIX}" \
            --src upstream/awam-tool-manager --entry src/server.py \
            --version "$VER_TOOL" --out "$FEED" --url-layout flat \
            --base-feed-url "$GH_FEED_BASE" --base-probe-url http://127.0.0.1:18778 \
            --platform "$PLATFORM" --python "$PY_ABS"
          "$PY_ABS" scripts/build_pack_feed.py build \
            --pack-id awam.file-gateway --name "awam-resource-gateway${SUFFIX}" \
            --src upstream/awam-file --entry src/awam_resource_gateway/__main__.py \
            --paths src --collect awam_resource_gateway \
            --add-data "src/awam_resource_gateway/filesystems.html;awam_resource_gateway" \
            --version "$VER_FILE" --out "$FEED" --url-layout flat \
            --base-feed-url "$GH_FEED_BASE" --base-probe-url http://127.0.0.1:18787 \
            --platform "$PLATFORM" --python "$PY_ABS"
          "$PY_ABS" scripts/build_pack_feed.py build \
            --pack-id awam.knowledge --name "awam-knowledge${SUFFIX}" \
            --src upstream/awam-knowledge --entry src/awam_knowledge/__main__.py \
            --paths src --collect awam_knowledge \
            --version "$VER_KM" --out "$FEED" --url-layout flat \
            --base-feed-url "$GH_FEED_BASE" --base-probe-url http://127.0.0.1:18790 \
            --platform "$PLATFORM" --python "$PY_ABS"
          echo "=== slice manifest ($PLATFORM) ==="; cat "$FEED/manifest.json"

      - name: Upload feed slice as artifact
        uses: actions/upload-artifact@v4
        with:
          name: afm-feed-${{ matrix.platform }}
          path: ${{ runner.temp }}/afm-feed-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1

  # 三平台 slice → 唯一 manifest：多 job 并发上传同名 manifest.json 会互相覆盖，
  # 所以 Release 上传与 OSS 镜像都集中在本 job（聚合后只上传一次）。
  merge-pack-feed:
    needs: [prepare, build-pack-feed, build-pack-feed-intel]
    # needs 默认要求三个上游 job 全部 success：任一平台构建失败就不聚合、不发 manifest，
    # finalize 会把 release 留在 draft。缺平台的 manifest 比没有 manifest 更糟（Mac 安装是空壳）。
    if: needs.prepare.outputs.want_feature_pack == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_FEED_BASE: https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download per-platform feed slices
        uses: actions/download-artifact@v4
        with:
          pattern: afm-feed-*
          path: ${{ runner.temp }}/feed-slices
          merge-multiple: false

      - name: Merge slices into single feed
        shell: bash
        run: |
          set -euo pipefail
          SLICES="${RUNNER_TEMP}/feed-slices"
          OUT="${RUNNER_TEMP}/afm-feed-final"
          ARGS=()
          for d in "$SLICES"/afm-feed-*; do
            [ -f "$d/manifest.json" ] || continue
            ARGS+=(--slice "$d")
          done
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "no feed slices found"
            exit 1
          fi
          python3 scripts/build_pack_feed.py merge-feed "${ARGS[@]}" --out "$OUT"
          echo "FEED_FINAL=$OUT" >> "$GITHUB_ENV"
          echo "=== merged manifest ==="; cat "$OUT/manifest.json"

      - name: Upload merged feed to GitHub Release (主源)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # GitHub Release 资产是扁平的：上传时只取 basename，与 manifest 的 flat URL（<base>/<name>）对齐。
          files=( "$FEED_FINAL"/artifacts/* "$FEED_FINAL"/packs/* "$FEED_FINAL"/manifest.json )
          if [ ${#files[@]} -eq 0 ]; then echo "no feed files"; exit 1; fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "Uploaded merged feed: ${files[*]}"

      # 回落源镜像（可选）：配齐 OSS_* secrets 才执行；缺失则静默跳过（单源 GitHub 仍完整可用）。
      # OSS 具体配置（bucket/endpoint/region/密钥/前缀）后续接入；此处用 rclone 泛化对象存储。
      - name: Mirror feed to object storage (回落源，配 OSS_* 才执行)
        env:
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_SECRET_ACCESS_KEY: ${{ secrets.OSS_SECRET_ACCESS_KEY }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OSS_ENDPOINT:-}" ] || [ -z "${OSS_BUCKET:-}" ] || [ -z "${OSS_ACCESS_KEY_ID:-}" ] || [ -z "${OSS_SECRET_ACCESS_KEY:-}" ]; then
            echo "OSS_* secrets 未配置 → 跳过对象存储镜像（仅 GitHub Release 主源）"
            exit 0
          fi
          # rclone s3 provider 兼容 OSS/S3/MinIO。前缀默认 release/${TAG}。
          PREFIX="${OSS_PREFIX:-release/${TAG}}"
          docker run --rm -e RCLONE_CONFIG_T_ENDPOINT="$OSS_ENDPOINT" \
            -e RCLONE_CONFIG_T_PROVIDER=Alibaba \
            -e RCLONE_CONFIG_T_ACCESS_KEY_ID="$OSS_ACCESS_KEY_ID" \
            -e RCLONE_CONFIG_T_SECRET_ACCESS_KEY="$OSS_SECRET_ACCESS_KEY" \
            -e RCLONE_CONFIG_T_REGION="${OSS_REGION:-}" \
            -v "$FEED_FINAL:/feed:ro" rclone/rclone \
            copy /feed "t:${OSS_BUCKET}/${PREFIX}" --max-transfer 2G -vv
          echo "已镜像到 s3://${OSS_BUCKET}/${PREFIX}"
          echo "注：启用回落时，把 AFM feed 的 fallbackManifestUrl 与 OSS 主机 allowHost 配到该镜像地址。"

  finalize:
    needs: [prepare, build-app, build-app-macos, publish-homebrew-tap, build-feature-packs, build-pack-feed, build-pack-feed-intel, merge-pack-feed]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # gh release edit/view resolve the repo from the working tree; without a
      # checkout they fail with "fatal: not a git repository".
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check dependent jobs
        shell: bash
        run: |
          set -euo pipefail
          echo "build-app=${{ needs.build-app.result }}"
          echo "build-app-macos=${{ needs.build-app-macos.result }}"
          echo "publish-homebrew-tap=${{ needs.publish-homebrew-tap.result }}"
          echo "build-feature-packs=${{ needs.build-feature-packs.result }}"
          echo "build-pack-feed=${{ needs.build-pack-feed.result }}"
          echo "build-pack-feed-intel=${{ needs.build-pack-feed-intel.result }}"
          echo "merge-pack-feed=${{ needs.merge-pack-feed.result }}"
          app="${{ needs.build-app.result }}"
          mac="${{ needs.build-app-macos.result }}"
          tap="${{ needs.publish-homebrew-tap.result }}"
          fp="${{ needs.build-feature-packs.result }}"
          feed_build="${{ needs.build-pack-feed.result }}"
          feed_intel="${{ needs.build-pack-feed-intel.result }}"
          feed_merge="${{ needs.merge-pack-feed.result }}"
          ok_app=false
          ok_mac=false
          ok_tap=false
          ok_fp=false
          ok_feed=false
          [[ "$app" == "success" || "$app" == "skipped" ]] && ok_app=true
          [[ "$mac" == "success" || "$mac" == "skipped" ]] && ok_mac=true
          [[ "$tap" == "success" || "$tap" == "skipped" ]] && ok_tap=true
          [[ "$fp" == "success" || "$fp" == "skipped" ]] && ok_fp=true
          # 三段 feed 链路都要健康：任一 build 失败时 merge 会被跳过，单看 merge
          # 会把「跳过」误判为正常并发布一个缺产物的 release。
          if [[ ( "$feed_build" == "success" || "$feed_build" == "skipped" ) && \
               ( "$feed_intel" == "success" || "$feed_intel" == "skipped" ) && \
               ( "$feed_merge" == "success" || "$feed_merge" == "skipped" ) ]]; then
            ok_feed=true
          fi
          if [ "$ok_app" != true ] || [ "$ok_mac" != true ] || [ "$ok_tap" != true ] || [ "$ok_fp" != true ] || [ "$ok_feed" != true ]; then
            echo "One or more build jobs failed; leaving release as draft"
            exit 1
          fi

      - name: Publish release (undraft)
        if: needs.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          PRE="${{ needs.prepare.outputs.prerelease }}"
          ARGS=(--draft=false)
          if [ "${PRE}" = "true" ]; then ARGS+=(--prerelease); else ARGS+=(--prerelease=false); fi
          gh release edit "${TAG}" "${ARGS[@]}"
          echo "Published ${TAG}"
          gh release view "${TAG}" --json name,isDraft,isPrerelease,url
