# SPDX-License-Identifier: GPL-3.0-or-later
# Tag 驱动发版：v* 标签指定版本 → 同步版本源 → 生成发版说明 → 打包 NSIS → 上传 GitHub Release。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 0.2.0 或 v0.2.0）；留空则用 package.json"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.version }}" ]; then
            RAW="${{ inputs.version }}"
            RAW="${RAW#v}"
            TAG="v${RAW}"
          else
            VER="$(node -p "require('./package.json').version")"
            TAG="v${VER}"
          fi
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "非法版本号: ${VERSION}"
            exit 1
          fi
          PRE=false
          if [[ "$VERSION" == *-* ]]; then
            PRE=true
          fi
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prerelease=${PRE}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag=${TAG} version=${VERSION} prerelease=${PRE}"

      - name: Sync version into package / tauri / cargo
        shell: bash
        run: node scripts/sync-version.mjs "${{ steps.meta.outputs.version }}"

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES_FILE="${RUNNER_TEMP}/afm-notes.md"

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          else
            PREV="$(git describe --tags --abbrev=0 HEAD 2>/dev/null || true)"
          fi

          BODY=""
          GEN_ARGS=(-f tag_name="${TAG}" -f target_commitish="${GITHUB_SHA}")
          if [ -n "${PREV}" ]; then
            GEN_ARGS+=(-f previous_tag_name="${PREV}")
          fi
          if BODY=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              "${GEN_ARGS[@]}" --jq .body 2>/dev/null); then
            :
          else
            if [ -n "${PREV}" ]; then
              RANGE="${PREV}..${GITHUB_SHA}"
              HEADING="## Changes since ${PREV}"
            else
              RANGE="${GITHUB_SHA}"
              HEADING="## Changes"
            fi
            {
              echo "${HEADING}"
              echo
              git log --pretty=format:'- %s (%h)' "${RANGE}"
              echo
            } > "${NOTES_FILE}.fallback"
            BODY="$(cat "${NOTES_FILE}.fallback")"
          fi

          {
            printf '%s\n\n' "${BODY}"
            echo "### Install"
            echo
            echo "Download the Windows NSIS \`.exe\` asset below, then install and run **A File Manager**."
            echo
            echo "All builds: https://github.com/${{ github.repository }}/releases"
          } > "${NOTES_FILE}"

          {
            echo "body<<EOF"
            cat "${NOTES_FILE}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust (respects rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify WebView2 auto-install bundling
        shell: bash
        run: |
          set -euo pipefail
          node -e "const c=require('./src-tauri/tauri.conf.json'); if(c.bundle?.windows?.webviewInstallMode?.type!=='embedBootstrapper') process.exit(1)"
          npm run test:deps-surface

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: "A File Manager ${{ steps.meta.outputs.tag }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          args: --bundles nsis
