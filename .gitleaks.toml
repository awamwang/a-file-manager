# gitleaks 配置：消解 generic-api-key 对本仓「非密钥」字符串的误报。
# 这些是 localStorage 键名 / 测试占位，被 `*_KEY = "…"` 形状命中，并非真实凭据。
[extend]
useDefault = true

[allowlist]
description = "false positives: localStorage 键名 / 测试占位被 generic-api-key 误判"
regexes = [
  # 旧标签固定存储键 afm.pinnedTabs.*（localStorage key，非密钥）
  '''afm\.pinnedTabs''',
]
