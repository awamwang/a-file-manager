[package]
name = "a-file-manager"
version = "0.1.0"
description = "A File Manager — Windows-first file manager (Tauri 2 + Vue 3)"
authors = ["Awam"]
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "a-file-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "a_file_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sigma-import"
path = "src/bin/sigma_import.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-frame = "1.1.8"
trash = "5.2"
file_icon_provider = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
base64 = "0.22"
once_cell = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
