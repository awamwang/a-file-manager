[package]
name = "a-file-manager"
version = "0.2.0"
description = "A File Manager — Windows-first file manager (Tauri 2 + Vue 3)"
authors = ["Awam"]
license = "GPL-3.0-or-later"
edition = "2021"
default-run = "a-file-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang.org/cargo/issues/8519
name = "a_file_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["ai-addon"]
## AI Add-on (AIA-222): Agent Targets, Skills, MCP, Harness, Providers, open-editor.
## Core-only package: `cargo build --no-default-features` (+ `VITE_AFM_AI_ADDON=0`).
ai-addon = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Environment",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
tauri-plugin-frame = "1.1.8"
trash = "5.2"
file_icon_provider = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico"] }
base64 = "0.22"
once_cell = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
tauri-plugin-drag = "2"
# Direct dep so AIA-261/264 host subclass can read OLE / deferred-activate / drag-gesture flags.
drag = "2.1.1"
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
tempfile = "3"

# AIA-240: local drag patch offers COPY|MOVE|LINK on Windows DoDragDrop.
# AIA-261/264: preserve prior foreground; distinguish click activate vs drag.
[patch.crates-io]
drag = { path = "patches/drag" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
